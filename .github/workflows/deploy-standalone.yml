name: Deploy standalone PWA

# Path-filtered so an unrelated desktop-app-only commit (e.g. an API route or SQLite schema
# change nothing here imports) never triggers a redeploy. Broader than strictly necessary on
# lib/** and components/** — many files under those cover desktop/server-only code the
# standalone app never bundles — but that's the safe direction: an occasional unnecessary
# redeploy costs a couple of build minutes, a missed one from too-narrow a filter ships stale
# shared-code changes silently.
on:
  push:
    branches: [main]
    paths:
      - "apps/standalone/**"
      - "lib/**"
      - "components/**"
      - "app/fonts.ts"
      - "app/globals.css"
      - ".github/workflows/deploy-standalone.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: apps/standalone
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/standalone/package-lock.json

      # The shared code this app imports (lib/**, components/**) physically lives at the repo
      # root, so Node/Turbopack resolve ITS packages by walking up from those files' own
      # directory — landing on the root's node_modules, never apps/standalone's. Without this,
      # every package a reused file needs (zustand, idb, tailwindcss, ...) fails to resolve on a
      # clean checkout, even though it's declared correctly in apps/standalone/package.json too.
      #
      # `npm install`, not `npm ci`, in both spots: both lockfiles are maintained on Windows dev
      # machines, and platform-specific optional deps (e.g. tailwindcss's Linux/wasm32 fallback
      # engine, never touched on Windows) don't reliably round-trip into a Windows-generated
      # lockfile. `npm ci`'s strict lockfile-match would fail here for reasons unrelated to any
      # real dependency change. This project has no other CI and one maintainer — the small loss
      # of install determinism is worth not fighting cross-platform lockfile drift.
      - run: npm install
        working-directory: .

      - run: npm install

      - run: npm run build

      # Requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets, and a Pages
      # project already created (name below) — see apps/standalone/README.md for setup.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/standalone
          command: pages deploy out --project-name=local-fi-standalone
